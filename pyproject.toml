[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elk-test-tools"
version = "0.1.0"
requires-python = ">=3.12"
license = {text = "MIT"}
# Private tool: never publish. PyPI rejects this classifier on upload.
classifiers = ["Private :: Do Not Upload"]
# Pinned to the pass-through branch until it is released (decision 34/38).
dependencies = ["elke27 @ git+https://github.com/mitchmitchell/elke27@e2470d8f87d1f9ee62face6b1bea91e88e414ebf"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
elk-remove-test-link = "elk_test_tools.link_removal:main"
elk-link-test-tool = "elk_test_tools.link_command:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
